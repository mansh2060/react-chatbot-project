<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;
        background-color: blue;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      button {
        background-color: rgb(25,135,84);
        border: none;
        color: white;
        padding:12px 20px;
        margin-left: 10px;
        border-radius: 10px;
        font-size:15px;
        cursor: pointer;
        margin-bottom: 15px;
      }

      input {
        width: 500px;
        border-color: black;
        color: black;
        border: none;
        border-radius: 10px;
        height: 20px;
        padding: 12px 15px;
        border-width:1px;
        font-size: 15px;
        flex-grow:1;
        margin-bottom: 15px;
        
      }

      .chat-input-container{
        display: flex;
        margin-bottom: 20px;
      }

      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        height: 100vh;
        flex-direction: column;

      }

      .chat-message-user{
        display: flex;
        justify-content: end;
        margin-top: 25px;
        align-items: start;
      }
      .chat-message-robot{
        display: flex;
        align-items: start;
      }

      .chat-message-text{
        background-color: rgb(238,238,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-profile{
        width: 50px;
        
      }

      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
        
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({chatMessages,setChatMessages}) {

        const [inputText,setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              message:inputText,
              sender:'user',
              id:crypto.randomUUID()
            }
          ];

          setChatMessages(newChatMessages);
          
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message:response,
              sender:'robot',
              id:crypto.randomUUID()
            }
          ]);

          setInputText('');
        }

        return (
          <div className="chat-input-container">
            <input placeholder="Send a message to Chatbot" size="30"
            onChange = {saveInputText}
            value = {inputText}
            
            />
            <button onClick={sendMessage}>Send</button>  
          </div>
          
        );
      }

      function ChatMessage({message,sender}) {
        return (
          <div className={sender === 'user' 
          ? 'chat-message-user' 
          : 'chat-message-robot'
           }>
            {sender === 'robot' && (<img src="robot.png"
            className = "chat-message-profile"
            />)}
            <div className="chat-message-text">
              {message}
            </div>
            
            {sender === 'user' && (<img src="user.png" className="chat-message-profile" />)}
            
          </div> 
        );
      }

      function ChatReplies({chatMessages}) {

        const chatMessageRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessageRef.current;
          if (containerElem){
            containerElem.scrollTop = containerElem.scrollHeight; 
          }
        },[chatMessages]);

        return (
          <div 
            className = "chat-message-container"
            ref = {chatMessageRef}
            >
            {chatMessages.map((chatMessage) => {
            return (
                <ChatMessage
                  message = {chatMessage.message}
                  sender = {chatMessage.sender}
                  key = { chatMessage.id }
                  
                />
              )
            })}
          </div>
        ); 
        
      }

      function App() {
        const [chatMessages,setChatMessages] = React.useState([
          {
            message : "hello chatbot",
            sender : "user",
            id : 'id1'
          },
          {
            message : "Hello!How can i help you ?",
            sender : "robot",
            id : 'id2'
          },

        ]);
        return (
            <div className="app-container">
              
              <ChatReplies 
                chatMessages = {chatMessages}
              />
              <ChatInput  
                chatMessages = {chatMessages}
                setChatMessages = {setChatMessages}
              />
            </div>
          );
        }
      
      
      
      const container = document.querySelector('.js-container');


      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
